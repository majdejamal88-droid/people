

name: Supabase Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8,20 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS and Supabase
        run: |
          echo "Checking DNS..."
          getent hosts rangzyutfitaumgskwzz.supabase.co || true

          echo "Checking Supabase..."
          curl --verbose --max-time 20 \
            https://rangzyutfitaumgskwzz.supabase.co/auth/v1/health
