<script>

let people = JSON.parse(localStorage.getItem("people")) || [];
people = people.filter(function(person) {
    return person.name !== null && person.name !== "null";
});

localStorage.setItem("people", JSON.stringify(people));
function addPerson() {

    let name = document.getElementById("name").value;
    let country = document.getElementById("country").value;
    let university = document.getElementById("university").value;
    let major = document.getElementById("major").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("email").value;
let existingPerson = people.find(function(person) {
    return person.name.trim().toLowerCase() === name.trim().toLowerCase();
});

if (existingPerson) {
   alert("⚠️ هذا الشخص موجود مسبقًا!\n💡 إذا أردت تغيير بياناته، استخدم زر «تعديل».");
    return;
}
    if (
        name === "" ||
        country === "" ||
        university === "" ||
        major === "" ||
        phone === "" ||
        email === ""
    ) {
        alert("⚠️ يرجى تعبئة جميع البيانات");
        return;
    }

    let person = {
    name: name,
    country: country,
    university: university,
    major: major,
    phone: phone,
    email: email,
    dateAdded: new Date().toLocaleDateString("ar-EG")
};

    people.push(person);

    localStorage.setItem("people", JSON.stringify(people));

    showPeople();

    alert("تمت إضافة الشخص بنجاح ✅");
}


function deletePerson(name) {
    let confirmDelete = confirm("هل أنت متأكد أنك تريد حذف " + name + "؟");
    if (confirmDelete) {
    people = people.filter(function(person) {
        return person.name !== name;
    });
    localStorage.setItem("people", JSON.stringify(people));
    showPeople();
    }
    } 

    

    people.forEach(function(person) {
        document.getElementById("peopleList").innerHTML +=
            "<p>الاسم: " + person.name +
            " | العمر: " + person.age +
            " | المدينة: " + person.city +
            " | الهاتف: " + person.phone +
            "<br><button class=\"delete-btn\" onclick=\"deletePerson('" + person.name + "')\">🗑️ حذف</button></p>";
});


   

function editPerson(name) {

    let person = people.find(function(person) {
        return person.name === name;
    });

    if (person) {

        let newName = prompt("اكتب الاسم الجديد:", person.name);
        let newCountry = prompt("اكتب البلد الجديد:", person.country);
        let newUniversity = prompt("اكتب الجامعة الجديدة:", person.university);
        let newMajor = prompt("اكتب التخصص الجديد:", person.major);
        let newPhone = prompt("اكتب رقم الهاتف الجديد:", person.phone);
        let newEmail = prompt("اكتب الإيميل الجديد:", person.email);
let duplicatePerson = people.find(function(p) {
    return p !== person &&
           p.name.trim().toLowerCase() === newName.trim().toLowerCase();
});

if (duplicatePerson) {
    alert("⚠️ لا يمكن استخدام هذا الاسم لأنه موجود لشخص آخر.");
    return;
}
        if (
            newName !== null &&
            newCountry !== null &&
            newUniversity !== null &&
            newMajor !== null &&
            newPhone !== null &&
            newEmail !== null
        ) {

            person.name = newName;
            person.country = newCountry;
            person.university = newUniversity;
            person.major = newMajor;
            person.phone = newPhone;
            person.email = newEmail;

            localStorage.setItem("people", JSON.stringify(people));

            showPeople();

            alert("تم تعديل البيانات بنجاح ✅");
        }
    }
}
function searchPerson() {

   let searchText =
    document.getElementById("searchName").value.trim().toLowerCase();

    if (searchText === "") {
        document.getElementById("searchResult").innerHTML = "";
        return;
    }

    let selectedCountry =
        document.getElementById("countryFilter").value;

    let selectedUniversity =
        document.getElementById("universityFilter").value;

    let selectedMajor =
        document.getElementById("majorFilter").value;

    let result = people.filter(function(person) {

        let matchesFilters =
            (selectedCountry === "" || person.country === selectedCountry) &&
            (selectedUniversity === "" || person.university === selectedUniversity) &&
            (selectedMajor === "" || person.major === selectedMajor);

        let matchesSearch =
            (person.name || "").toLowerCase().includes(searchText) ||
            (person.country || "").toLowerCase().includes(searchText) ||
            (person.university || "").toLowerCase().includes(searchText) ||
            (person.major || "").toLowerCase().includes(searchText) ||
            (person.phone || "").toLowerCase().includes(searchText) ||
            (person.email || "").toLowerCase().includes(searchText);

        return matchesFilters && matchesSearch;

    });

    if (result.length > 0) {

        document.getElementById("searchResult").innerHTML =
            result.map(function(person) {

                return "<p>" +
                    "<strong class=\"person-name\">" +
                    "<a href=\"person.html?name=" +
                    encodeURIComponent(person.name) +
                    "\">👤 " + person.name + "</a>" +
                    "</strong>" +
                    "<br>🌍 <strong>البلد:</strong> " + person.country +
                    "<br>🎓 <strong>الجامعة:</strong> " + person.university +
                    "<br>📚 <strong>التخصص:</strong> " + person.major +
                    "<br>📅 <strong>تاريخ الإضافة:</strong> " + (person.dateAdded || "غير محدد") +
                    "<br>📞 <strong>رقم الهاتف:</strong> <a href=\"tel:" + person.phone + "\">" + person.phone + "</a>" +
                    "<br>💬 <a href=\"https://wa.me/" +
                    (person.phone || "").replace(/\D/g, "").replace(/^0/, "970") +
                    "\" target=\"_blank\" class=\"whatsapp-btn\">🟢 فتح واتساب</a>" +
                    "<br>📧 <strong>الإيميل:</strong> <a href=\"mailto:" +
                    person.email + "\">" + person.email + "</a>" +
                    "<br><button class=\"delete-btn\" onclick=\"deletePerson('" +
                    person.name + "')\">🗑️ حذف</button>" +
                    "<button class=\"edit-btn\" onclick=\"editPerson('" +
                    person.name + "')\">🖊️ تعديل</button>" +
                    "</p>";

            }).join("");

    } else {

        document.getElementById("searchResult").innerHTML =
            "<p>🔍 لا يوجد أشخاص يطابقون البحث والفلاتر الحالية ❌</p>";

    }
}

function copyPhone(phone) {

    navigator.clipboard.writeText(phone);

    alert("تم نسخ رقم الهاتف 📋✅");
}
function copyEmail(email) {

    navigator.clipboard.writeText(email);

    alert("تم نسخ الإيميل 📋✅");
}
function showPeople() {

    document.getElementById("peopleList").innerHTML = "";
if (people.length === 0) {
    alert("القائمة فاضية");
    document.getElementById("peopleList").innerHTML =
        "<p>👥 لا يوجد أشخاص مضافون حاليًا<br>ابدأ بإضافة أول شخص! ❤️</p>";
    return;
}
    document.getElementById("count").innerHTML =
    people.length;
let countries = [];

people.forEach(function(person) {

    if (person.country && !countries.includes(person.country)) {
        countries.push(person.country);
    }

});

document.getElementById("countryCount").innerHTML =
    countries.length;
    let universities = [];

people.forEach(function(person) {

    if (person.university && !universities.includes(person.university)) {
        universities.push(person.university);
    }

});

document.getElementById("universityCount").innerHTML =
    universities.length;
    let majors = [];

people.forEach(function(person) {

    if (person.major && !majors.includes(person.major)) {
        majors.push(person.major);
    }

});

document.getElementById("majorCount").innerHTML =
    majors.length;
    people.forEach(function(person, index) {

        document.getElementById("peopleList").innerHTML +=
            "<p>" +
            "<strong class=\"person-name\">#" + (index + 1) + " 👤 " + person.name + "</strong>" +
            "<br>🌍 <strong>البلد:</strong> " + person.country +
            "<br>🎓 <strong>الجامعة:</strong> " + person.university +
            "<br>📚 <strong>التخصص:</strong> " + person.major +
            "<br>📅 <strong>تاريخ الإضافة:</strong> " + (person.dateAdded || "غير محدد") +
            "<br>📞 <strong>رقم الهاتف:</strong> <a href=\"tel:" + person.phone + "\">" + person.phone + "</a>" +
            "<br><button class=\"copy-phone-btn\" onclick=\"copyPhone('" + person.phone + "')\">📋 نسخ الرقم</button>" +
"<br>💬 <a href=\"https://wa.me/" + (person.phone || "").replace(/\D/g, "").replace(/^0/, "970") + "\" target=\"_blank\" class=\"whatsapp-btn\">🟢 فتح واتساب</a>" +
"<br>📧 <strong>الإيميل:</strong> <a href=\"mailto:" + person.email + "\">" + person.email + "</a>" +
"<br><button class=\"copy-email-btn\" onclick=\"copyEmail('" + person.email + "')\">📋 نسخ الإيميل</button>" +
            "<br><button class=\"delete-btn\" onclick=\"deletePerson('" + person.name + "')\">🗑️ حذف</button>" +
            "<button class=\"edit-btn\" onclick=\"editPerson('" + person.name + "')\">🖊️ تعديل</button></p>";

    });
    updateCountryFilter();
    updateUniversityFilter();
    updateMajorFilter();
}
function exportPeople() {

    let data = JSON.stringify(people, null, 2);

    let file = new Blob([data], {
        type: "application/json"
    });

    let link = document.createElement("a");

    link.href = URL.createObjectURL(file);
    link.download = "people-data.json";

    link.click();

    URL.revokeObjectURL(link.href);
}
function importPeople() {

    let file = document.getElementById("importFile").files[0];

    if (!file) {
        return;
    }

    let reader = new FileReader();

    reader.onload = function(event) {
if (!confirm("⚠️ استيراد البيانات سيستبدل البيانات الحالية. هل أنت متأكد؟")) {
    document.getElementById("importFile").value = "";
    return;
}
        try {

            let importedPeople = JSON.parse(event.target.result);

            if (!Array.isArray(importedPeople)) {
                alert("❌ الملف غير صحيح");
                return;
            }

            people = importedPeople;

            localStorage.setItem("people", JSON.stringify(people));

            showPeople();

            alert("تم استيراد البيانات بنجاح ✅");

        } catch (error) {

            alert("❌ الملف غير صالح");
        }
    };

    reader.readAsText(file);
}
function deleteAll() {

    let confirmDelete = confirm("هل أنت متأكد أنك تريد حذف كل الأشخاص؟ 🗑️");

    if (confirmDelete) {

        people = [];

        localStorage.setItem("people", JSON.stringify(people));

        showPeople();

        alert("تم حذف كل الأشخاص 🗑️");
    }
}
function sortPeople() {

    people.sort(function(a, b) {
        return a.name.localeCompare(b.name, "ar");
    });

    localStorage.setItem("people", JSON.stringify(people));

    showPeople();

    alert("تم ترتيب الأشخاص حسب الاسم 🔤");
}
function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");

    let darkButton = document.getElementById("darkModeBtn");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkMode", "enabled");
        darkButton.innerHTML = "☀️ الوضع العادي";
    } else {
        localStorage.setItem("darkMode", "disabled");
        darkButton.innerHTML = "🌙 الوضع الليلي";
    }
}
if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");

    document.getElementById("darkModeBtn").innerHTML =
        "☀️ الوضع العادي";
}
function welcomeUser() {

    let userName = localStorage.getItem("userName");

    if (!userName) {
        userName = prompt("ما اسمك؟");

        if (userName) {
            localStorage.setItem("userName", userName);
        }
    }

    if (userName) {
        document.getElementById("welcome").innerHTML =
            "أهلاً وسهلاً يا " + userName + " 👋❤️";
    }
}
showPeople();
welcomeUser();
function changeUserName() {

    let newName = prompt("اكتب اسمك الجديد:");

            "أهلاً وسهلاً يا " + newName + " 👋❤️";

}
function updateCountryFilter() {

    let countryFilter = document.getElementById("countryFilter");

    let countries = [];

    people.forEach(function(person) {

        if (person.country && !countries.includes(person.country)) {
            countries.push(person.country);
        }

    });

    countryFilter.innerHTML = '<option value="">🌍 كل البلدان</option>';

    countries.forEach(function(country) {

        countryFilter.innerHTML +=
            '<option value="' + country + '">' + country + '</option>';

    });
}
function filterByCountry() {

    let selectedCountry = document.getElementById("countryFilter").value;

    let result = people.filter(function(person) {

        return selectedCountry === "" || person.country === selectedCountry;

    });

    document.getElementById("peopleList").innerHTML = "";

    result.forEach(function(person, index) {

        document.getElementById("peopleList").innerHTML +=
            "<p>" +
            "<strong class=\"person-name\">#" + (index + 1) + " 👤 " + person.name + "</strong>" +
            "<br>🌍 <strong>البلد:</strong> " + person.country +
            "<br>🎓 <strong>الجامعة:</strong> " + person.university +
            "<br>📚 <strong>التخصص:</strong> " + person.major +
            "<br>📅 <strong>تاريخ الإضافة:</strong> " + (person.dateAdded || "غير محدد") +
            "<br>📞 <strong>رقم الهاتف:</strong> <a href=\"tel:" + person.phone + "\">" + person.phone + "</a>" +
            "<br><button class=\"copy-phone-btn\" onclick=\"copyPhone('" + person.phone + "')\">📋 نسخ الرقم</button>" +
            "<br>💬 <a href=\"https://wa.me/" + (person.phone || "").replace(/\D/g, "").replace(/^0/, "970") + "\" target=\"_blank\" class=\"whatsapp-btn\">🟢 فتح واتساب</a>" +
            "<br>📧 <strong>الإيميل:</strong> <a href=\"mailto:" + person.email + "\">" + person.email + "</a>" +
            "<br><button class=\"copy-email-btn\" onclick=\"copyEmail('" + person.email + "')\">📋 نسخ الإيميل</button>" +
            "<br><button class=\"delete-btn\" onclick=\"deletePerson('" + person.name + "')\">🗑️ حذف</button>" +
            "<button class=\"edit-btn\" onclick=\"editPerson('" + person.name + "')\">🖊️ تعديل</button>" +
            "</p>";

    });
}
function updateUniversityFilter() {

    let universityFilter = document.getElementById("universityFilter");

    let universities = [];

    people.forEach(function(person) {

        if (person.university && !universities.includes(person.university)) {
            universities.push(person.university);
        }

    });

    universityFilter.innerHTML = '<option value="">🎓 كل الجامعات</option>';

    universities.forEach(function(university) {

        universityFilter.innerHTML +=

        return selectedUniversity === "" ||

            "<br>📞 <strong>رقم الهاتف:</strong> " + person.phone +

function filterByMajor() {

    let selectedCountry =
        document.getElementById("countryFilter").value;

    let selectedUniversity =
        document.getElementById("universityFilter").value;

    let selectedMajor =
        document.getElementById("majorFilter").value;

    let result = people.filter(function(person) {

        return (
            (selectedCountry === "" || person.country === selectedCountry) &&

            (selectedMajor === "" || person.major === selectedMajor)
        );

    });

    document.getElementById("peopleList").innerHTML = "";

    result.forEach(function(person, index) {

        document.getElementById("peopleList").innerHTML +=
            "<p>" +
            "<strong class=\"person-name\">#" + (index + 1) + " 👤 " + person.name + "</strong>" +
            "<br>🌍 <strong>البلد:</strong> " + person.country +

    });
}
function clearFilters() {

    document.getElementById("countryFilter").value = "";
    document.getElementById("universityFilter").value = "";
    document.getElementById("majorFilter").value = "";

    showPeople();
}
function updateMajorFilter() {

    let majorFilter = document.getElementById("majorFilter");

        if (person.major && !majors.includes(person.major)) {
            majors.push(person.major);

function clearSearch() {
    document.getElementById("searchName").value = "";

    document.getElementById("countryFilter").value = "";
    document.getElementById("universityFilter").value = "";
    document.getElementById("majorFilter").value = "";

    document.getElementById("searchResult").innerHTML = "";

    document.getElementById("searchName").focus();
}
